[SystemSettingsEditor]
; Editor/PIE only. 2-player PIE renders two separate worlds on one GPU, so every per-scene buffer
; (Lumen surface cache, shadows, distance fields) exists twice. With the canyon, the default
; 4096 atlas pushed a 6 GB card ~120 MB over its video memory budget ("Video memory has been
; exhausted"); 2048 frees ~500 MB with no visible difference at greybox stage. A packaged game
; renders one world per machine and keeps the default.
r.LumenScene.SurfaceCache.AtlasSize=2048
; Milestone 8: with the era levels' copies, the halved atlas overflowed on the first level ("Lumen surface cache atlas
; oversubscribed by 10-12%" at The Climb), and surfaces it couldn't fit lit up milky white. Half the card texel
; density (default 100) needs about a quarter of the space: the same headroom as the full atlas, no extra video memory.
r.LumenScene.SurfaceCache.CardTexelDensityScale=50

; Online service (Milestone 7). THE switch:
;   EOS  = Epic Online Services: Epic account login, internet sessions with invites and join codes, voice chat,
;          traffic relayed peer to peer through EOS (nobody opens router ports)
;   Null = LAN only, no login and no voice: the fallback for local testing
; A game process can override it: -ini:Engine:[OnlineSubsystem]:DefaultPlatformService=Null
; Play-In-Editor uses PIEOnlineService in DefaultGame.ini instead (Null by default, see NOTES.md).
[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemNull]
bEnabled=true

[OnlineSubsystemEOS]
bEnabled=true

; The product's IDs and client secret are NOT here: they live in Config/Windows/WindowsEngine.ini, which git
; ignores (copy Config/EOSCredentials.example.ini there). Everything below is safe to share.
[/Script/OnlineSubsystemEOS.EOSSettings]
CacheDir=CacheDir
DefaultArtifactName=OurLastEcho
bEnableOverlay=True
bEnableSocialOverlay=True
bEnableEditorOverlay=False
; Remember the Epic login between runs; the first time, the Epic account portal opens
bPreferPersistentAuth=True
bUseEAS=True
bUseEOSConnect=True
bUseEOSRTC=True
+AuthScopeFlags=BasicProfile
+AuthScopeFlags=FriendsList
+AuthScopeFlags=Presence

; The EOS SDK's start-up messages print the product's IDs: keep only its warnings and errors in logs
; (for a deep dive, run with -LogCmds="LogEOSSDK Log")
[Core.Log]
LogEOSSDK=Warning

; Game connections go peer to peer through EOS (relayed when needed, so no port forwarding). The EOS driver falls
; back to plain IP for LAN (Null) games, whose listen URLs carry ?bUseIPSockets (UEchoSessionSubsystem).
; The editor (Play-In-Editor) keeps the engine's IP driver.
[/Script/Engine.GameEngine]
